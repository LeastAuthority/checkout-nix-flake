name: Integration

on:
  push:
    branches:
      - main
    paths:
      - 'action.yml'
      - '.github/workflows/dependabot.yml'
      - '.github/workflows/integration.yml'
      - 'tests/**'
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/dependabot.yml'
      - '.github/workflows/integration.yml'
      - 'tests/**'

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Install Nix
        id: install_nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Checkout action
        id: checkout_action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            ./action.yml

      - name: Checkout flake
        id: checkout_flake
        uses: ./
        with:
          path: ./flake
          dir: tests/fixtures/basic-flake

      - name: Check Nix Flake
        id: check_flake
        working-directory: ./flake/tests/fixtures/basic-flake
        run: |
          nix flake check
